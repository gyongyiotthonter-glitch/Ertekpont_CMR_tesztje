<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ÉrtékPont CRM (staging)</title>
<style>
:root{--navy:#1f3b57;--gold:#b08a2e;--bg:#f4f6f9;--card:#fff;--line:#e2e8f0;--muted:#64748b;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,system-ui,Arial,sans-serif;background:var(--bg);color:#1e293b}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy)}
.loginbox{background:#fff;border-radius:14px;padding:2rem;width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.loginbox h1{color:var(--navy);font-size:1.4rem;margin:.2rem 0}.loginbox .sub{color:var(--gold);font-weight:600;margin-bottom:1.2rem}
input,select,textarea{width:100%;padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;font-size:.92rem;font-family:inherit;margin-bottom:.55rem;background:#fff}
button{cursor:pointer;border:none;border-radius:8px;padding:.5rem .9rem;font-size:.9rem;font-weight:600}
button:disabled{opacity:.6;cursor:default}
.btn-primary{background:var(--navy);color:#fff}.btn-gold{background:var(--gold);color:#fff}.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn-sm{padding:.26rem .55rem;font-size:.8rem}.w100{width:100%}
.err{color:var(--danger);font-size:.85rem;min-height:1.1rem}
header.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:1rem;padding:.55rem 1rem;position:sticky;top:0;z-index:10;flex-wrap:wrap}
header.top .brand{font-weight:700}header.top .brand span{color:var(--gold)}
header.top nav{display:flex;gap:.15rem;flex-wrap:wrap;flex:1}
header.top nav a{color:#dbe4ee;text-decoration:none;padding:.3rem .6rem;border-radius:7px;font-size:.86rem;cursor:pointer}
header.top nav a.active,header.top nav a:hover{background:rgba(255,255,255,.14);color:#fff}
header.top .who{font-size:.8rem;color:#cfe;display:flex;gap:.5rem;align-items:center}
main{max-width:1100px;margin:1.1rem auto;padding:0 1rem}
h2.view{color:var(--navy);margin:.2rem 0 1rem}
.bar{display:flex;gap:.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.bar input,.bar select{margin:0;max-width:230px;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .pad{padding:.75rem .9rem}
.card h3{margin:.1rem 0 .3rem;font-size:1rem;color:var(--navy);cursor:pointer}
.card .meta{color:var(--muted);font-size:.84rem;line-height:1.5}
.thumb{aspect-ratio:16/10;background:#e7edf4;cursor:pointer;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pill{display:inline-block;font-size:.71rem;font-weight:600;padding:.13rem .5rem;border-radius:20px;background:#eef2f7;color:#334155;margin:.1rem .1rem 0 0}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.info{background:#e0edff;color:#1e40af}.pill.gold{background:#f7edd3;color:#7a5c12}.pill.danger{background:#fde2e2;color:#991b1b}
.metric{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem}
.metric .m{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.6rem 1rem;min-width:110px}
.metric .m b{display:block;font-size:1.4rem;color:var(--navy)}.metric .m span{font-size:.78rem;color:var(--muted)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);font-size:.86rem;vertical-align:top}
th{background:#f8fafc;color:var(--muted);font-weight:600}tr:last-child td{border-bottom:none}
.row-link{color:var(--navy);cursor:pointer;font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;max-width:680px;width:100%;padding:1.3rem}
.modal h3{color:var(--navy);margin:.1rem 0 1rem}
.muted{color:var(--muted)}.small{font-size:.82rem}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:.1rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.section{margin:1rem 0}.section h4{color:var(--navy);border-bottom:2px solid var(--line);padding-bottom:.3rem;margin-bottom:.5rem}
.gallery{display:flex;gap:.4rem;flex-wrap:wrap}.gallery img{height:80px;border-radius:6px;cursor:pointer}
.copy{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:0 .2rem}
.toast{position:fixed;bottom:1rem;right:1rem;background:var(--navy);color:#fff;padding:.6rem 1rem;border-radius:8px;z-index:100;opacity:0;transition:.3s}.toast.show{opacity:1}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200}.lightbox img{max-width:92%;max-height:88%;border-radius:8px}
.subform{background:#f8fafc;border:1px dashed var(--line);border-radius:8px;padding:.6rem;margin:.3rem 0}
@media(max-width:600px){.two,.three{grid-template-columns:1fr}header.top nav a{font-size:.8rem;padding:.28rem .5rem}}
</style>
</head>
<body>
<div id="login"><div class="loginbox">
  <h1>ÉrtékPont <span>CRM</span></h1><div class="sub">Belépés</div>
  <input id="email" type="email" placeholder="e-mail" autocomplete="username"/>
  <input id="password" type="password" placeholder="jelszó" autocomplete="current-password"/>
  <div class="err" id="loginErr"></div>
  <button class="btn-primary w100" id="loginBtn">Belépés</button>
  <div class="small muted" style="margin-top:.8rem">staging környezet</div>
</div></div>
<div id="app" class="hidden">
  <header class="top"><div class="brand">ÉrtékPont <span>CRM</span></div><nav id="nav"></nav>
    <div class="who"><span id="whoami"></span><button class="btn-ghost btn-sm" id="logoutBtn">Kilépés</button></div></header>
  <main id="main"></main>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://mbstluwcnskwwxzyotwa.supabase.co';
const SUPABASE_KEY='sb_publishable_99ouBRzc7xe5b6kr82lxIQ_Xl1kOPfE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const ft=n=>n==null?'–':(n>=1e6?(n/1e6).toLocaleString('hu-HU',{maximumFractionDigits:1})+' M Ft':Number(n).toLocaleString('hu-HU')+' Ft');
const today=()=>new Date().toISOString().slice(0,10);
window.PH_IMG='data:image/svg+xml;charset=utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><rect width="100%" height="100%" fill="#e7edf4"/><text x="50%" y="50%" fill="#9db0c4" font-family="sans-serif" font-size="15" text-anchor="middle" dy=".3em">Nincs fotó</text></svg>');
const INTEZ=['Közös','Gyöngyi','Norbi'];
const LEAD_STATES=['Új','Aktív','Későbbre téve','Lezárt'];
const RESULTS=['Nem értem el','Beszéltünk, visszahívás','Később aktuális','Találkozó egyeztetve','Nem aktuális','Megbízás lett belőle'];
let ME=null,CONTACTS=[];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
window.cp=async t=>{try{await navigator.clipboard.writeText(t);toast('Másolva');}catch(e){toast('Nem sikerült másolni');}};
function telLine(a){return (a||[]).map(t=>`<a href="tel:${esc(t)}">${esc(t)}</a> <button class="copy" onclick="cp('${esc(t)}')" title="másolás">📋</button>`).join(' ')||'–';}
function mailLine(a){return (a||[]).map(e=>`<a href="mailto:${esc(e)}">${esc(e)}</a> <button class="copy" onclick="cp('${esc(e)}')" title="másolás">📋</button>`).join(' ')||'–';}
async function busy(btn,fn){if(btn){btn.disabled=true;var o=btn.textContent;btn.textContent='Mentés…';}try{await fn();}catch(e){toast('Hiba: '+e.message);}finally{if(btn){btn.disabled=false;btn.textContent=o;}}}

$('#loginBtn').onclick=async()=>{$('#loginErr').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginErr').textContent='Hibás e-mail vagy jelszó.';return;}boot();};
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click();});
$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return;}
  ME=session.user.email;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#whoami').textContent=ME;
  await reloadContacts();buildNav();route('dashboard');}
async function reloadContacts(){CONTACTS=(await sb.from('contacts').select('id,nev').order('nev')).data||[];}
const VIEWS=[['dashboard','Műszerfal'],['leads','Lead ingatlanok'],['properties','Ingatlanok'],['searches','Keresett ingatlanok'],['matching','Párosítás'],['recos','Kiajánlások'],['tasks','Feladatok'],['contacts','Kapcsolatok']];
function buildNav(){$('#nav').innerHTML=VIEWS.map(([k,l])=>`<a data-v="${k}">${l}</a>`).join('');document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>route(a.dataset.v));}
function setActive(v){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.v===v));}
async function route(v){setActive(v);const m=$('#main');m.innerHTML='<p class="muted">Betöltés…</p>';try{await ({dashboard:vDashboard,leads:vLeads,properties:vProperties,searches:vSearches,matching:vMatching,recos:vRecos,tasks:vTasks,contacts:vContacts}[v])(m);}catch(e){m.innerHTML='<p class="err">Hiba: '+esc(e.message)+'</p>';}}
function contactOptions(sel){return '<option value="">– válassz meglévőt –</option>'+CONTACTS.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nev)}</option>`).join('');}
function personPicker(pfx,sel){return `<select id="${pfx}_sel">${contactOptions(sel)}</select>
  <div class="small muted" style="margin:.1rem 0 .2rem">— vagy új személy (ha nincs a listában):</div>
  <div class="two"><input id="${pfx}_nev" placeholder="Új személy neve"/><input id="${pfx}_tel" placeholder="telefon"/></div>`;}
async function resolvePerson(pfx){const nev=($('#'+pfx+'_nev')?.value||'').trim();if(nev){const tel=($('#'+pfx+'_tel')?.value||'').trim();const r=await sb.from('contacts').insert({nev,telefonok:tel?[tel]:[]}).select('id').single();if(r.error)throw r.error;await reloadContacts();return r.data.id;}return $('#'+pfx+'_sel')?.value||null;}

// ---------- Dashboard ----------
const isCRM=t=>!['egyeb','magan'].includes(t.targy_tabla);
const due=t=>t.mikorra&&t.mikorra<=today();
async function vDashboard(m){
  const tasks=(await sb.from('tasks').select('*').neq('statusz','Kész').order('mikorra',{ascending:true,nullsFirst:false})).data||[];
  const leads=(await sb.from('leads').select('*,contacts(nev)')).data||[];
  const intez=[...new Set(tasks.map(t=>t.gazda).filter(Boolean))];const tip=[...new Set(tasks.map(t=>t.tipus).filter(Boolean))];
  const need=leads.filter(l=>l.allapot==='Aktív'&&(!l.kovetkezo_lepes||!l.kovetkezo_datum));
  m.innerHTML=`<h2 class="view">Műszerfal</h2>
   <div class="metric"><div class="m"><b>${tasks.filter(t=>isCRM(t)&&due(t)).length}</b><span>CRM – ma/lejárt</span></div>
     <div class="m"><b>${need.length}</b><span>Intézkedést igénylő lead</span></div><div class="m"><b>${leads.length}</b><span>Lead összesen</span></div></div>
   <div class="bar"><select id="d_n"><option value="crm">CRM feladatok</option><option value="egyeb">Egyéb</option><option value="magan">Magán</option><option value="mind">Mind</option></select>
     <select id="d_i"><option value="">Bárki intézi</option>${intez.map(g=>`<option>${esc(g)}</option>`).join('')}</select>
     <select id="d_t"><option value="">Minden típus</option>${tip.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
     <label class="small" style="margin:0"><input type="checkbox" id="d_d" checked style="width:auto"> csak esedékes/lejárt</label></div>
   <div id="d_tasks"></div>
   <div class="section"><h4>Leadek, amelyek intézkedést igényelnek</h4>${need.length?tbl(['Kapcsolat','Hely/típus','Miért'],need.map(l=>[`<span class="row-link" onclick="openLead('${l.id}')">${esc(l.contacts?.nev||'–')}</span>`,esc(l.telepules||l.ingatlan_tipus||''),`<span class="pill danger">${!l.kovetkezo_lepes?'nincs következő lépés':'nincs dátum'}</span>`])):'<p class="muted">Nincs ilyen.</p>'}</div>`;
  const draw=()=>{const n=$('#d_n').value,i=$('#d_i').value,tp=$('#d_t').value,d=$('#d_d').checked;
    const rows=tasks.filter(t=>{const cat=t.targy_tabla==='magan'?'magan':t.targy_tabla==='egyeb'?'egyeb':'crm';if(n!=='mind'&&cat!==n)return false;if(i&&t.gazda!==i)return false;if(tp&&t.tipus!==tp)return false;if(d&&!due(t))return false;return true;});
    $('#d_tasks').innerHTML=rows.length?tbl(['Mikorra','Következő lépés','Típus','Kategória','Intézi'],rows.map(t=>[esc(t.mikorra||'–'),esc(t.kovetkezo_lepes||''),esc(t.tipus||''),esc(t.targy_tabla||'CRM'),esc(t.gazda||'')])):'<p class="muted">Nincs a szűrőnek megfelelő teendő.</p>';};
  ['d_n','d_i','d_t','d_d'].forEach(id=>$('#'+id).onchange=draw);draw();
}
function tbl(head,rows){return `<div class="tblwrap"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;}

// ---------- Leads (Lead ingatlanok) ----------
function needAct(l){return l.allapot==='Aktív'&&(!l.kovetkezo_lepes||!l.kovetkezo_datum);}
async function vLeads(m){
  const l=(await sb.from('leads').select('*,contacts(nev)').order('kovetkezo_datum',{ascending:true,nullsFirst:true})).data||[];window._leads=l;
  m.innerHTML=`<h2 class="view">Lead ingatlanok</h2><div class="bar"><button class="btn-gold" onclick="newLead()">+ Új lead ingatlan</button></div>
   ${tbl(['Ingatlan / hely','Tulajdonos','Következő lépés','Mikor','Állapot'],l.map(x=>[`<span class="row-link" onclick="openLead('${x.id}')">${esc(x.telepules||x.ingatlan_tipus||'Lead')}</span>`,esc(x.contacts?.nev||'–'),esc(x.kovetkezo_lepes||''),x.kovetkezo_datum?esc(x.kovetkezo_datum):'',needAct(x)?'<span class="pill danger">Intézkedést igényel</span>':`<span class="pill info">${esc(x.allapot||'')}</span>`]))}`;
}
window.newLead=()=>leadForm();
window.openLead=async id=>{const l=(window._leads||[]).find(x=>x.id===id)||(await sb.from('leads').select('*,contacts(nev)').eq('id',id).single()).data;
  const acts=(await sb.from('lead_activities').select('*').eq('lead_id',id).order('letrehozva',{ascending:false})).data||[];
  modal(`<h3>Lead ingatlan — ${esc(l.telepules||l.ingatlan_tipus||'')}</h3>
   ${needAct(l)?'<div class="pill danger">Intézkedést igényel: hiányzik a következő lépés/dátum</div>':''}
   <div class="two"><div><label>Típus</label>${esc(l.ingatlan_tipus||'–')}</div><div><label>Ügylet</label>${esc(l.elado_kiado||'–')}</div></div>
   <div class="two"><div><label>Hely</label>${esc(l.telepules||'–')}</div><div><label>Hirdetési ár</label>${ft(l.hirdetesi_ar)}</div></div>
   <div><label>Tulajdonos</label>${esc(l.contacts?.nev||'–')}</div>
   ${l.tulajdonosi_hirdetes_link?`<div><label>Tulajdonosi hirdetés</label><a href="${esc(l.tulajdonosi_hirdetes_link)}" target="_blank">megnyit</a></div>`:''}
   <div class="section"><h4>Kapcsolatfelvétel rögzítése</h4>
     <label>Eredmény</label><select id="r_res">${RESULTS.map(r=>`<option>${r}</option>`).join('')}</select>
     <div class="two"><div><label>Következő lépés</label><input id="r_next" value="${esc(l.kovetkezo_lepes||'')}"/></div><div><label>Dátum</label><input type="date" id="r_date" value="${l.kovetkezo_datum||''}"/></div></div>
     <label>Intézi</label><select id="r_who">${INTEZ.map(w=>`<option>${w}</option>`).join('')}</select>
     <div class="bar"><button class="btn-primary" id="r_btn" onclick="logResult('${id}',this)">Rögzítés + teendő</button>
       <button class="btn-gold" onclick="mandateDialog('${id}')">Megbízás lett belőle →</button>
       <button class="btn-ghost" onclick="leadForm('${id}')">Szerkesztés</button></div></div>
   <div class="section"><h4>Előzmények (${acts.length})</h4>${acts.map(a=>`<div class="small">• ${esc(a.letrehozva?.slice(0,10)||'')} — ${esc(a.tipus||'')}${a.eredmeny?' · '+esc(a.eredmeny):''}${a.kovetkezo_lepes?' → '+esc(a.kovetkezo_lepes):''}</div>`).join('')||'<span class="muted small">nincs</span>'}</div>
   <div class="bar"><button class="btn-ghost" onclick="closeModal()">Bezár</button></div>`);
};
window.logResult=async(id,btn)=>busy(btn,async()=>{const res=$('#r_res').value,next=$('#r_next').value.trim()||null,date=$('#r_date').value||null,who=$('#r_who').value;
  await sb.from('lead_activities').insert({lead_id:id,tipus:'Kapcsolatfelvétel',eredmeny:res,kovetkezo_lepes:next,mikorra:date,ki:ME});
  const upd={kovetkezo_lepes:next,kovetkezo_datum:date};upd.allapot=res==='Nem aktuális'?'Lezárt':res==='Később aktuális'?'Későbbre téve':'Aktív';
  await sb.from('leads').update(upd).eq('id',id);
  if(next&&date)await upsertTask('lead',id,next,date,who);
  if(res==='Megbízás lett belőle')return mandateDialog(id);
  closeModal();toast('Rögzítve'+((next&&date)?' + teendő':''));route('leads');});
function leadForm(id){const l=id?(window._leads||[]).find(x=>x.id===id)||{}:{};const nf=!id;
  modal(`<h3>${id?'Lead ingatlan szerkesztése':'Új lead ingatlan'}</h3>
   <div class="section"><h4>Ingatlanvázlat</h4>
     <div class="two"><div><label>Eladó / kiadó</label><select id="l_uk"><option ${l.elado_kiado!=='Kiadó'?'selected':''}>Eladó</option><option ${l.elado_kiado==='Kiadó'?'selected':''}>Kiadó</option></select></div>
       <div><label>Ingatlantípus</label><input id="l_tip" value="${esc(l.ingatlan_tipus||'')}"/></div></div>
     <div class="two"><div><label>Település</label><input id="l_telep" value="${esc(l.telepules||'')}"/></div><div><label>Cím / utca, házszám</label><input id="l_cim" value="${esc(l.utca_hazszam||'')}"/></div></div>
     <div class="three"><div><label>Alapterület m²</label><input id="l_alap" type="number" value="${l.netto_alap??''}"/></div><div><label>Telek m²</label><input id="l_telek" type="number" value="${l.telek??''}"/></div><div><label>Szobaszám</label><input id="l_szoba" type="number" value="${l.szobak??''}"/></div></div>
     <div class="two"><div><label>Hirdetési ár (teljes Ft)</label><input id="l_ar" type="number" value="${l.hirdetesi_ar??''}"/></div><div><label>Leadforrás</label><select id="l_forras">${['Hideghívás','Korábbi ügyfél','Személyes kapcsolat','Másik ingatlan miatt hívott','Ügyféloldali megkeresés','Egyéb'].map(f=>`<option ${l.forras===f?'selected':''}>${f}</option>`).join('')}</select></div></div>
     <label>Tulajdonosi hirdetés link</label><input id="l_link" value="${esc(l.tulajdonosi_hirdetes_link||'')}"/>
     <label>Megjegyzés</label><textarea id="l_megj">${esc(l.megjegyzes||'')}</textarea>
     <div class="two"><div><label>Következő feladat</label><input id="l_next" value="${esc(l.kovetkezo_lepes||'')}"/></div><div><label>Időpont</label><input type="date" id="l_date" value="${l.kovetkezo_datum||''}"/></div></div>
     ${!id?'<label>Feladatot intézi</label><select id="l_who">'+INTEZ.map(w=>`<option>${w}</option>`).join('')+'</select>':''}</div>

  m.innerHTML=`<h2 class="view">Párosítás</h2><div class="bar"><button class="btn-gold" id="mc_btn" onclick="recompute(this)">Párosítás újraszámolása</button><span class="muted small">${mt.length} találat</span></div>
   ${Object.values(groups).map(rows=>{const s=rows[0].search_requirements;const sid=rows[0].search_requirement_id;return `<div class="section"><h4>${esc(s?.contacts?.nev||'Kereső')} — ${esc(s?.telepules||'')} ${esc(s?.ingatlan_tipus||'')} (max ${ft(s?.max_ar)}${s?.min_szoba?', min '+s.min_szoba+' szoba':''})</h4>
     <div class="tblwrap"><table><tr><th><input type="checkbox" onclick="document.querySelectorAll('.mchk-${sid}').forEach(c=>c.checked=this.checked)"></th><th>Ingatlan</th><th>Pont</th><th>Magyarázat</th></tr>${rows.map(r=>`<tr><td><input type="checkbox" class="mchk-${sid}" value="${r.property_id}"></td><td>${esc(r.properties?.cim||'')} <span class="muted small">${esc(r.properties?.ingatlan_tipus||'')} ${r.properties?.netto_alap?r.properties.netto_alap+' m²':''}</span></td><td><b>${r.pontszam}</b></td><td class="small">${esc(r.egyezes?.szoveg||'')} ${r.kezi_ellenorzes?'<span class="pill warn">Ár hiányzik – kézi ellenőrzés</span>':''}</td></tr>`).join('')}</table></div>
     <div class="bar"><button class="btn-gold btn-sm" onclick="buildReco('${sid}','${s?.contact_id||''}')">Kijelöltek kiajánlása →</button></div></div>`;}).join('')||'<p class="muted">Nincs találat. Futtasd az újraszámolást.</p>'}`;
}
window.recompute=btn=>busy(btn,async()=>{const {error}=await sb.rpc('fn_szamol_parositas');if(error)throw error;toast('Párosítás frissítve');route('matching');});

// ---------- Recommendations ----------
window.buildReco=async(sid,cid)=>{
  const ids=[...document.querySelectorAll('.mchk-'+sid+':checked')].map(c=>c.value);
  if(!ids.length)return toast('Jelölj ki legalább egy ingatlant');
  if(!cid){const s=(await sb.from('search_requirements').select('contact_id').eq('id',sid).single()).data;cid=s?.contact_id;}
  const props=(await sb.from('properties').select('id,cim,ingatlan_tipus,netto_alap,mandates(iranyar)').in('id',ids)).data||[];
  const prev=await sb.from('recommendation_items').select('property_id,recommendations!inner(contact_id)').in('property_id',ids).eq('recommendations.contact_id',cid);
  const dupIds=new Set((prev.data||[]).map(x=>x.property_id));
  const c=(await sb.from('contacts').select('nev,emailek').eq('id',cid).single()).data;
  const lines=props.map(p=>`• ${p.cim||'(cím)'} – ${p.ingatlan_tipus||''}${p.netto_alap?', '+p.netto_alap+' m²':''} – ${ft((p.mandates||[])[0]?.iranyar)}`).join('\n');
  const body=`Kedves ${c?.nev||'Érdeklődő'}!\n\nAz alábbi ingatlanokat ajánljuk figyelmébe:\n\n${lines}\n\nÜdvözlettel,\nÉrtékPont Ingatlan`;
  const email=(c?.emailek||[])[0]||'';
  modal(`<h3>Kiajánlás előnézete</h3>
   ${dupIds.size?`<div class="pill warn">Figyelem: ${dupIds.size} ingatlant már ajánlottál ennek az ügyfélnek.</div>`:''}
   <label>Címzett</label><input id="rc_to" value="${esc(email)}"/>
   <label>Tárgy</label><input id="rc_subj" value="Ingatlanajánlat – ÉrtékPont"/>
   <label>Szöveg</label><textarea id="rc_body" style="min-height:180px">${esc(body)}</textarea>
   <div class="bar"><button class="btn-primary" onclick="openMail()">E-mail megnyitása</button><button class="btn-ghost" onclick="cp(document.getElementById('rc_body').value)">Szöveg másolása</button>
     <button class="btn-gold" id="rc_btn" onclick="saveReco('${sid}','${cid}','${ids.join(',')}',this)">Kiajánlás rögzítése</button><button class="btn-ghost" onclick="closeModal()">Bezár</button></div>`);
};
window.openMail=()=>{const to=$('#rc_to').value,su=encodeURIComponent($('#rc_subj').value),bo=encodeURIComponent($('#rc_body').value);window.location.href=`mailto:${to}?subject=${su}&body=${bo}`;};
window.saveReco=(sid,cid,idsStr,btn)=>busy(btn,async()=>{const ids=idsStr.split(',').filter(Boolean);
  const rec=await sb.from('recommendations').insert({contact_id:cid,search_requirement_id:sid,csatorna:'email'}).select('id').single();if(rec.error)throw rec.error;
  await sb.from('recommendation_items').insert(ids.map(pid=>({recommendation_id:rec.data.id,property_id:pid})));
  closeModal();toast('Kiajánlás rögzítve ('+ids.length+' ingatlan)');route('recos');});
async function vRecos(m){
  const r=(await sb.from('recommendations').select('*,contacts(nev),recommendation_items(reakcio,properties(cim))').order('datum',{ascending:false})).data||[];
  m.innerHTML=`<h2 class="view">Kiajánlások</h2><div class="bar muted small">Új kiajánlást a Párosítás fülön indíthatsz (több ingatlan is kijelölhető).</div>
   ${r.length?tbl(['Dátum','Ügyfél','Ingatlan(ok)','Csatorna'],r.map(x=>[esc(x.datum?.slice(0,10)||''),esc(x.contacts?.nev||''),(x.recommendation_items||[]).map(i=>esc(i.properties?.cim||'')).join(', '),esc(x.csatorna||'')])):'<p class="muted">Még nincs kiajánlás.</p>'}`;
}

// ---------- Contacts (háttér-nyilvántartás) ----------
async function vContacts(m){
  const c=(await sb.from('contacts').select('*').order('nev')).data||[];window._contacts=c;
  const [owners,searches,leads]=await Promise.all([
    sb.from('property_owners').select('contact_id,properties(cim)'),
    sb.from('search_requirements').select('contact_id,telepules,ingatlan_tipus,max_ar'),
    sb.from('leads').select('contact_id,telepules,ingatlan_tipus,kovetkezo_lepes,kovetkezo_datum')]);
  const roleMap={};const push=(cid,txt)=>{if(!cid)return;(roleMap[cid]=roleMap[cid]||[]).push(txt);};
  (owners.data||[]).forEach(o=>push(o.contact_id,(o.properties?.cim||'ingatlan')+' – tulajdonos'));
  (searches.data||[]).forEach(s=>push(s.contact_id,`${s.ingatlan_tipus||'ingatlant'} keres ${s.telepules||''}${s.max_ar?', max '+ft(s.max_ar):''}`));
  (leads.data||[]).forEach(l=>{push(l.contact_id,(l.telepules||l.ingatlan_tipus||'lead')+' – lead tulajdonosa');if(l.kovetkezo_lepes&&l.kovetkezo_datum)push(l.contact_id,`következő: ${l.kovetkezo_lepes} (${l.kovetkezo_datum})`);});
  m.innerHTML=`<h2 class="view">Kapcsolatok <span class="small muted">(háttér-nyilvántartás)</span></h2><div class="bar"><input id="cs" placeholder="Keresés név / telefon…"/><button class="btn-gold" onclick="editContact()">+ Új kapcsolat</button></div><div id="clist" class="grid"></div>`;
  const draw=()=>{const s=($('#cs').value||'').toLowerCase();
    $('#clist').innerHTML=c.filter(x=>!s||(x.nev||'').toLowerCase().includes(s)||(x.telefonok||[]).join(' ').includes(s)).map(x=>{const roles=roleMap[x.id]||[];
      return `<div class="card"><div class="pad"><h3 onclick="openContact('${x.id}')">${esc(x.nev)}</h3>
        <div class="meta">${(x.telefonok||[]).length?telLine(x.telefonok):'<span class="muted">nincs telefon</span>'}<br>
        ${roles.length?roles.map(r=>`<div>• ${esc(r)}</div>`).join(''):'<span class="muted">nincs kapcsolódó ügy</span>'}</div>
        ${x.ne_keressuk?'<span class="pill warn">Ne keressük</span>':''}</div></div>`;}).join('')||'<p class="muted">Nincs találat.</p>';};
  $('#cs').oninput=draw;draw();
}
window.openContact=async id=>{const c=(window._contacts||[]).find(x=>x.id===id)||(await sb.from('contacts').select('*').eq('id',id).single()).data;
  modal(`<h3>${esc(c.nev)}</h3>
   <div><label>Típus</label>${esc(c.tipus||'Magánszemély')}</div>
   <div><label>Telefon</label>${telLine(c.telefonok)}</div><div><label>E-mail</label>${mailLine(c.emailek)}</div>
   <div><label>Cím</label>${esc(c.telepules||c.cim||'–')}</div>
   ${c.altalanos_megjegyzes?`<div><label>Megjegyzés</label>${esc(c.altalanos_megjegyzes)}</div>`:''}
   <div class="bar"><button class="btn-ghost" onclick="editContact('${id}')">Szerkesztés</button><button class="btn-ghost" onclick="closeModal()">Bezár</button></div>`);};
window.editContact=id=>{const c=id?(window._contacts||[]).find(x=>x.id===id)||{}:{};
  modal(`<h3>${id?'Kapcsolat szerkesztése':'Új kapcsolat'}</h3>
   <label>Név *</label><input id="f_nev" value="${esc(c.nev||'')}"/>
   <div class="two"><div><label>Típus</label><select id="f_tip"><option ${c.tipus!=='Cég'?'selected':''}>Magánszemély</option><option ${c.tipus==='Cég'?'selected':''}>Cég</option></select></div><div><label>Cím (opcionális)</label><input id="f_cim" value="${esc(c.telepules||'')}"/></div></div>
   <div class="two"><div><label>Telefon(ok), vesszővel</label><input id="f_tel" value="${esc((c.telefonok||[]).join(', '))}"/></div><div><label>E-mail(ek), vesszővel</label><input id="f_email" value="${esc((c.emailek||[]).join(', '))}"/></div></div>
   <label>Általános megjegyzés</label><textarea id="f_megj">${esc(c.altalanos_megjegyzes||'')}</textarea>
   <label class="small"><input type="checkbox" id="f_ne" ${c.ne_keressuk?'checked':''} style="width:auto"> Ne keressük</label>
   <div class="bar"><button class="btn-primary" id="f_btn" onclick="saveContact('${id||''}',this)">Mentés</button><button class="btn-ghost" onclick="closeModal()">Mégse</button></div>`);};
window.saveContact=(id,btn)=>busy(btn,async()=>{const arr=v=>v.split(',').map(x=>x.trim()).filter(Boolean);
  const rec={nev:$('#f_nev').value.trim(),tipus:$('#f_tip').value,telepules:$('#f_cim').value.trim()||null,telefonok:arr($('#f_tel').value),emailek:arr($('#f_email').value),altalanos_megjegyzes:$('#f_megj').value.trim()||null,ne_keressuk:$('#f_ne').checked,modositva:new Date().toISOString()};
  if(!rec.nev)throw new Error('A név kötelező');
  const r=id?await sb.from('contacts').update(rec).eq('id',id):await sb.from('contacts').insert(rec);if(r.error)throw r.error;
  await reloadContacts();closeModal();toast('Mentve');route('contacts');});

function modal(html){closeModal();const bg=el(`<div class="modal-bg" id="modalBg"><div class="modal">${html}</div></div>`);bg.onclick=e=>{if(e.target===bg)closeModal();};document.body.appendChild(bg);}
window.closeModal=()=>{const b=$('#modalBg');if(b)b.remove();};
boot();
</script>
</body>
</html>
