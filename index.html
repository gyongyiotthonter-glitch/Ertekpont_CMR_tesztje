<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ÉrtékPont CRM (staging)</title>
<style>
:root{--navy:#1f3b57;--gold:#b08a2e;--bg:#f4f6f9;--card:#fff;--line:#e2e8f0;--muted:#64748b;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,system-ui,Arial,sans-serif;background:var(--bg);color:#1e293b}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy)}
.loginbox{background:#fff;border-radius:14px;padding:2rem;width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.loginbox h1{color:var(--navy);font-size:1.4rem;margin:.2rem 0}.loginbox .sub{color:var(--gold);font-weight:600;margin-bottom:1.2rem}
input,select,textarea{width:100%;padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;font-size:.92rem;font-family:inherit;margin-bottom:.55rem;background:#fff}
button{cursor:pointer;border:none;border-radius:8px;padding:.5rem .9rem;font-size:.9rem;font-weight:600}
button:disabled{opacity:.6;cursor:default}
.btn-primary{background:var(--navy);color:#fff}.btn-gold{background:var(--gold);color:#fff}.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn-sm{padding:.26rem .55rem;font-size:.8rem}.w100{width:100%}
.err{color:var(--danger);font-size:.85rem;min-height:1.1rem}
header.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:1rem;padding:.55rem 1rem;position:sticky;top:0;z-index:10;flex-wrap:wrap}
header.top .brand{font-weight:700}header.top .brand span{color:var(--gold)}
header.top nav{display:flex;gap:.15rem;flex-wrap:wrap;flex:1}
header.top nav a{color:#dbe4ee;text-decoration:none;padding:.3rem .6rem;border-radius:7px;font-size:.86rem;cursor:pointer}
header.top nav a.active,header.top nav a:hover{background:rgba(255,255,255,.14);color:#fff}
header.top .who{font-size:.8rem;color:#cfe;display:flex;gap:.5rem;align-items:center}
main{max-width:1100px;margin:1.1rem auto;padding:0 1rem}
h2.view{color:var(--navy);margin:.2rem 0 1rem}
.bar{display:flex;gap:.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.bar input,.bar select{margin:0;max-width:230px;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .pad{padding:.75rem .9rem}
.card h3{margin:.1rem 0 .3rem;font-size:1rem;color:var(--navy);cursor:pointer}
.card .meta{color:var(--muted);font-size:.84rem;line-height:1.5}
.thumb{aspect-ratio:16/10;background:#e7edf4;cursor:pointer;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pill{display:inline-block;font-size:.71rem;font-weight:600;padding:.13rem .5rem;border-radius:20px;background:#eef2f7;color:#334155;margin:.1rem .1rem 0 0}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.info{background:#e0edff;color:#1e40af}.pill.gold{background:#f7edd3;color:#7a5c12}.pill.danger{background:#fde2e2;color:#991b1b}
.metric{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem}
.metric .m{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.6rem 1rem;min-width:110px}
.metric .m b{display:block;font-size:1.4rem;color:var(--navy)}.metric .m span{font-size:.78rem;color:var(--muted)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);font-size:.86rem;vertical-align:top}
th{background:#f8fafc;color:var(--muted);font-weight:600}tr:last-child td{border-bottom:none}
.row-link{color:var(--navy);cursor:pointer;font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;max-width:680px;width:100%;padding:1.3rem}
.modal h3{color:var(--navy);margin:.1rem 0 1rem}
.muted{color:var(--muted)}.small{font-size:.82rem}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:.1rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.section{margin:1rem 0}.section h4{color:var(--navy);border-bottom:2px solid var(--line);padding-bottom:.3rem;margin-bottom:.5rem}
.gallery{display:flex;gap:.4rem;flex-wrap:wrap}.gallery img{height:80px;border-radius:6px;cursor:pointer}
.copy{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:0 .2rem}
.toast{position:fixed;bottom:1rem;right:1rem;background:var(--navy);color:#fff;padding:.6rem 1rem;border-radius:8px;z-index:100;opacity:0;transition:.3s}.toast.show{opacity:1}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200}.lightbox img{max-width:92%;max-height:88%;border-radius:8px}
.subform{background:#f8fafc;border:1px dashed var(--line);border-radius:8px;padding:.6rem;margin:.3rem 0}
@media(max-width:600px){.two,.three{grid-template-columns:1fr}header.top nav a{font-size:.8rem;padding:.28rem .5rem}}
.bugbtn{position:fixed;bottom:1rem;left:1rem;background:#fff;border:1px solid var(--line);color:var(--danger);z-index:90;border-radius:20px;padding:.42rem .8rem;font-size:.82rem;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.12);cursor:pointer}
.mini{width:54px;height:40px;object-fit:cover;border-radius:5px;background:#e7edf4;vertical-align:middle;display:inline-block}
.filelbl{display:inline-block;position:relative;overflow:hidden}
.filelbl input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;width:100%;height:100%}
.up{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.bulkbar{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin:.3rem 0}
.pmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem}
.pmc{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.pmc>img{width:100%;height:104px;object-fit:cover;display:block;cursor:pointer;background:#e7edf4}
.pmc .pmck{position:absolute;top:.3rem;left:.3rem;width:auto;margin:0;transform:scale(1.25)}
.pmc .cov{position:absolute;top:.3rem;right:.3rem;background:var(--gold);color:#fff;font-size:.66rem;font-weight:700;padding:.1rem .45rem;border-radius:10px}
.pmc-b{display:flex;flex-wrap:wrap;gap:.2rem;padding:.3rem;justify-content:center}
.pmc-b button{padding:.2rem .42rem;font-size:.72rem}
.leadphoto{width:100%;max-width:260px;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:#e7edf4;display:block;margin-bottom:.4rem}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.16);color:#fff;font-size:2rem;border:none;width:48px;height:66px;cursor:pointer;border-radius:8px}
.lb-prev{left:2%}.lb-next{right:2%}
.lb-x{position:absolute;top:3%;right:3%;background:rgba(255,255,255,.16);color:#fff;font-size:1.1rem;width:40px;height:40px;border:none;cursor:pointer;border-radius:50%}
@media(max-width:600px){.pmc>img{height:120px}.lb-nav{width:40px;height:56px;font-size:1.5rem}}
.lcard{display:flex;gap:.7rem;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.5rem;margin-bottom:.55rem}
.lcard:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.lc-img{width:120px;min-width:120px;height:80px;object-fit:cover;border-radius:8px;background:#e7edf4;cursor:pointer}
.lc-body{flex:1;min-width:0}
.lc-body h3{margin:.05rem 0 .2rem;font-size:1rem;color:var(--navy);cursor:pointer}
.thumb-md{width:112px;height:74px;object-fit:cover;border-radius:7px;background:#e7edf4;vertical-align:middle;cursor:pointer}
.recocard{display:flex;gap:.7rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem;margin-bottom:.5rem;cursor:pointer}
.recocard:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.recostrip{display:flex;gap:.25rem;overflow:hidden}
.recostrip img{width:64px;height:46px;object-fit:cover;border-radius:5px;background:#e7edf4}
.rprev{border:1px solid var(--line);border-radius:8px;padding:.6rem;background:#fff;max-height:360px;overflow:auto}
.rp-prop{border-bottom:1px solid var(--line);padding:.5rem 0}
.rp-imgs{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem}
.rp-imgs img{width:118px;height:84px;object-fit:cover;border-radius:6px}
.rsel-imgs{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem}
.rs-i{position:relative;cursor:pointer;border:2px solid transparent;border-radius:6px;overflow:hidden}
.rs-i.sel{border-color:var(--gold)}
.rs-i img{width:80px;height:58px;object-fit:cover;display:block}
.rs-i .rs-c{position:absolute;top:1px;right:2px;background:var(--gold);color:#fff;font-size:.6rem;padding:0 .25rem;border-radius:8px}
@media(max-width:600px){.lcard{flex-direction:column}.lc-img{width:100%;height:150px}.thumb-md{width:96px;height:64px}}
</style>
</head>
<body>
<div id="login"><div class="loginbox">
  <h1>ÉrtékPont <span>CRM</span></h1><div class="sub">Belépés</div>
  <input id="email" type="email" placeholder="e-mail" autocomplete="username"/>
  <input id="password" type="password" placeholder="jelszó" autocomplete="current-password"/>
  <div class="err" id="loginErr"></div>
  <button class="btn-primary w100" id="loginBtn">Belépés</button>
  <div class="small muted" style="margin-top:.8rem">staging környezet</div>
</div></div>
<div id="app" class="hidden">
  <header class="top"><div class="brand">ÉrtékPont <span>CRM</span></div><nav id="nav"></nav>
    <div class="who"><span id="whoami"></span><button class="btn-ghost btn-sm" id="logoutBtn">Kilépés</button></div></header>
  <main id="main"></main>
</div>
<div id="toast" class="toast"></div>
<button class="bugbtn" id="bugbtn" onclick="bugReport()">⚠ Hiba jelzése</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const SUPABASE_URL='https://mbstluwcnskwwxzyotwa.supabase.co';
const SUPABASE_KEY='sb_publishable_99ouBRzc7xe5b6kr82lxIQ_Xl1kOPfE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const ft=n=>n==null?'–':(n>=1e6?(n/1e6).toLocaleString('hu-HU',{maximumFractionDigits:1})+' M Ft':Number(n).toLocaleString('hu-HU')+' Ft');
const today=()=>new Date().toISOString().slice(0,10);
window.PH_IMG='data:image/svg+xml;charset=utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><rect width="100%" height="100%" fill="#e7edf4"/><text x="50%" y="50%" fill="#9db0c4" font-family="sans-serif" font-size="15" text-anchor="middle" dy=".3em">Nincs fotó</text></svg>');
const INTEZ=['Közös','Gyöngyi','Norbi'];
const LEAD_STATES=['Új','Aktív','Későbbre téve','Lezárt'];
const RESULTS=['Nem értem el','Beszéltünk, visszahívás','Később aktuális','Találkozó egyeztetve','Nem aktuális','Megbízás lett belőle'];
let ME=null,CONTACTS=[];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
window.cp=async t=>{try{await navigator.clipboard.writeText(t);toast('Másolva');}catch(e){toast('Nem sikerült másolni');}};
function telLine(a){return (a||[]).map(t=>`<a href="tel:${esc(t)}">${esc(t)}</a> <button class="copy" onclick="cp('${esc(t)}')" title="másolás">📋</button>`).join(' ')||'–';}
function mailLine(a){return (a||[]).map(e=>`<a href="mailto:${esc(e)}">${esc(e)}</a> <button class="copy" onclick="cp('${esc(e)}')" title="másolás">📋</button>`).join(' ')||'–';}
async function busy(btn,fn){if(btn){btn.disabled=true;var o=btn.textContent;btn.textContent='Mentés…';}try{await fn();}catch(e){toast('Hiba: '+e.message);}finally{if(btn){btn.disabled=false;btn.textContent=o;}}}

$('#loginBtn').onclick=async()=>{$('#loginErr').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginErr').textContent='Hibás e-mail vagy jelszó.';return;}boot();};
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click();});
$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};
async function boot(){document.body.removeAttribute('data-app-ready');const {data:{session}}=await sb.auth.getSession();if(!session){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return;}
  ME=session.user.email;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#whoami').textContent=ME;
  await reloadContacts();buildNav();await route('dashboard');document.body.dataset.appReady='true';}
async function reloadContacts(){CONTACTS=(await sb.from('contacts').select('id,nev').order('nev')).data||[];}
const VIEWS=[['dashboard','Műszerfal'],['tasks','Feladatok'],['leads','Lead-ek'],['properties','Megbízások'],['searches','Keresések'],['matching','Párosítás'],['recos','Kiajánlások'],['contacts','Ügyfelek']];
function buildNav(){$('#nav').innerHTML=VIEWS.map(([k,l])=>`<a data-v="${k}">${l}</a>`).join('');document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>route(a.dataset.v));}
function setActive(v){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.v===v));}
async function route(v){setActive(v);const m=$('#main');m.innerHTML='<p class="muted">Betöltés…</p>';try{await ({dashboard:vDashboard,leads:vLeads,properties:vProperties,searches:vSearches,matching:vMatching,recos:vRecos,tasks:vTasks,contacts:vContacts}[v])(m);}catch(e){m.innerHTML='<p class="err">Hiba: '+esc(e.message)+'</p>';}}
function contactOptions(sel){return '<option value="">– válassz meglévőt –</option>'+CONTACTS.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nev)}</option>`).join('');}
function personPicker(pfx,sel){return `<select id="${pfx}_sel">${contactOptions(sel)}</select>
  <div class="small muted" style="margin:.1rem 0 .2rem">— vagy új személy (ha nincs a listában):</div>
  <div class="two"><input id="${pfx}_nev" placeholder="Új személy neve"/><input id="${pfx}_tel" placeholder="telefon"/></div>`;}
async function resolvePerson(pfx){const nev=($('#'+pfx+'_nev')?.value||'').trim();if(nev){const tel=($('#'+pfx+'_tel')?.value||'').trim();const r=await sb.from('contacts').insert({nev,telefonok:tel?[tel]:[]}).select('id').single();if(r.error)throw r.error;await reloadContacts();return r.data.id;}return $('#'+pfx+'_sel')?.value||null;}

// ---------- Dashboard ----------
const isCRM=t=>!['egyeb','magan'].includes(t.targy_tabla);
const due=t=>t.mikorra&&t.mikorra<=today();
async function vDashboard(m){
  const tasks=(await sb.from('tasks').select('*').eq('statusz','Aktív').order('mikorra',{ascending:true,nullsFirst:false})).data||[];
  const leads=(await sb.from('leads').select('*,contacts(nev)')).data||[];
  const CM=await coverMaps();
  const intez=[...new Set(tasks.map(t=>t.gazda).filter(Boolean))];const tip=[...new Set(tasks.map(t=>t.tipus).filter(Boolean))];
  const need=leads.filter(l=>l.allapot==='Aktív'&&(!l.kovetkezo_lepes||!l.kovetkezo_datum));
  m.innerHTML=`<h2 class="view">Műszerfal</h2>
   <div class="metric"><div class="m"><b>${tasks.filter(t=>isCRM(t)&&due(t)).length}</b><span>CRM – ma/lejárt</span></div>
     <div class="m"><b>${need.length}</b><span>Intézkedést igénylő lead</span></div><div class="m"><b>${leads.length}</b><span>Lead összesen</span></div></div>
   <div class="bar"><select id="d_n"><option value="crm">CRM feladatok</option><option value="egyeb">Egyéb</option><option value="magan">Magán</option><option value="mind">Mind</option></select>
     <select id="d_i"><option value="">Bárki intézi</option>${intez.map(g=>`<option>${esc(g)}</option>`).join('')}</select>
     <select id="d_t"><option value="">Minden típus</option>${tip.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
     <label class="small" style="margin:0"><input type="checkbox" id="d_d" checked style="width:auto"> csak esedékes/lejárt</label></div>
   <div id="d_tasks"></div>
   <div class="section"><h4>Leadek, amelyek intézkedést igényelnek</h4>${need.length?tbl(['','Kapcsolat','Hely/típus','Miért'],need.map(l=>[miniThumb(CM.leadCover[l.id]),`<span class="row-link" onclick="openLead('${l.id}')">${esc(l.contacts?.nev||'–')}</span>`,esc(l.telepules||l.ingatlan_tipus||''),`<span class="pill danger">${!l.kovetkezo_lepes?'nincs következő lépés':'nincs dátum'}</span>`])):'<p class="muted">Nincs ilyen.</p>'}</div>`;
  const draw=()=>{const n=$('#d_n').value,i=$('#d_i').value,tp=$('#d_t').value,d=$('#d_d').checked;
    const rows=tasks.filter(t=>{const cat=t.targy_tabla==='magan'?'magan':t.targy_tabla==='egyeb'?'egyeb':'crm';if(n!=='mind'&&cat!==n)return false;if(i&&t.gazda!==i)return false;if(tp&&t.tipus!==tp)return false;if(d&&!due(t))return false;return true;});
    $('#d_tasks').innerHTML=rows.length?tbl(['','Mikorra','Következő lépés','Típus','Kategória','Intézi'],rows.map(t=>[`<span onclick="openTask('${t.id}')" style="cursor:pointer">${miniThumb(taskCover(t,CM))}</span>`,esc(t.mikorra||'–'),`<span class="row-link" onclick="openTask('${t.id}')">${esc(t.kovetkezo_lepes||'(feladat)')}</span>`,esc(t.tipus||''),esc(t.targy_tabla||'CRM'),esc(t.gazda||'')])):'<p class="muted">Nincs a szűrőnek megfelelő teendő.</p>';};
  window._CM=CM;
  ['d_n','d_i','d_t','d_d'].forEach(id=>$('#'+id).onchange=draw);draw();
}
function tbl(head,rows){return `<div class="tblwrap"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;}

// ---------- Leads (Lead ingatlanok) ----------
function needAct(l){return l.allapot==='Aktív'&&(!l.kovetkezo_lepes||!l.kovetkezo_datum);}
async function vLeads(m){
  const l=(await sb.from('leads').select('*,contacts(nev),lead_photos(storage_path),properties(property_photos(storage_path,borito,sorrend))').order('kovetkezo_datum',{ascending:true,nullsFirst:true})).data||[];window._leads=l;
  m.innerHTML=`<h2 class="view">Lead-ek</h2><div class="bar"><button class="btn-gold" onclick="newLead()">+ Új lead ingatlan</button></div>
   <div>${l.length?l.map(x=>{const k=leadCoverKey(x);const cim=esc(x.telepules||x.ingatlan_tipus||'Lead');
     return `<div class="lcard">
       <img class="lc-img" loading="lazy" src="${k?esc(fotoUrl(k)):PH_IMG}" onclick="openLead('${x.id}')" onerror="this.onerror=null;this.src=PH_IMG">
       <div class="lc-body"><h3 onclick="openLead('${x.id}')">${cim}</h3>
         <div class="meta">${esc(x.ingatlan_tipus||'')}${x.elado_kiado?' · '+esc(x.elado_kiado):''}${x.hirdetesi_ar?' · '+ft(x.hirdetesi_ar):''}<br>
         Tulajdonos: ${esc(x.contacts?.nev||'–')}<br>
         ${x.kovetkezo_lepes?'Következő: '+esc(x.kovetkezo_lepes)+(x.kovetkezo_datum?' ('+esc(x.kovetkezo_datum)+')':''):'<span class="muted">nincs következő lépés</span>'}</div>
         <div style="margin-top:.25rem">${needAct(x)?'<span class="pill danger">Intézkedést igényel</span>':`<span class="pill info">${esc(x.allapot||'')}</span>`}</div>
       </div></div>`;}).join(''):'<p class="muted">Nincs lead.</p>'}</div>`;
}
window.newLead=()=>leadForm();
window.openLead=async id=>{const l=(window._leads||[]).find(x=>x.id===id)||(await sb.from('leads').select('*,contacts(nev)').eq('id',id).single()).data;
  const acts=(await sb.from('lead_activities').select('*').eq('lead_id',id).order('letrehozva',{ascending:false})).data||[];
  const lp=(await sb.from('lead_photos').select('storage_path').eq('lead_id',id).maybeSingle()).data;

// ---------- Recommendations ----------
window.buildReco=async(sid,cid)=>{
  const ids=[...document.querySelectorAll('.mchk-'+sid+':checked')].map(c=>c.value);
  if(!ids.length)return toast('Jelölj ki legalább egy ingatlant');
  if(!cid){const s=(await sb.from('search_requirements').select('contact_id').eq('id',sid).single()).data;cid=s?.contact_id;}
  const props=(await sb.from('properties').select('id,cim,ingatlan_tipus,netto_alap,mandates(iranyar),property_photos(id,storage_path,borito,sorrend,lathatosag)').in('id',ids)).data||[];
  const c=(await sb.from('contacts').select('nev,emailek').eq('id',cid).single()).data;
  const byId={};props.forEach(p=>byId[p.id]=p);const ordered=ids.map(i=>byId[i]).filter(Boolean);
  const sel={};ordered.forEach(p=>{const pub=recoPub(p);sel[p.id]=pub.length?[pub[0].storage_path]:[];});
  window._reco={sid,cid,c,ordered,sel};
  const email=(c?.emailek||[])[0]||'';
  modal(`<h3>Kiajánlás összeállítása</h3>
   <label>Címzett</label><input id="rc_to" value="${esc(email)}"/>
   <label>Tárgy</label><input id="rc_subj" value="Ingatlanajánlat – ÉrtékPont"/>
   <label>Bevezető szöveg</label><textarea id="rc_intro" style="min-height:66px">Kedves ${esc(c?.nev||'Érdeklődő')}!\n\nAz alábbi ingatlanokat ajánljuk figyelmébe:</textarea>
   <div class="section"><h4>Ingatlanok és képek</h4><div class="small muted">Csak a „Webre mehet” állapotú képek választhatók; ingatlanonként legfeljebb 4. Az első a borító.</div>
     <div id="rc_props"></div></div>
   <div class="bar"><button class="btn-ghost" onclick="recoPreview()">Előnézet</button><button class="btn-ghost" onclick="recoPdf()">PDF letöltése</button>
     <button class="btn-ghost" onclick="recoMail()">E-mail (szöveg)</button>
     <button class="btn-gold" id="rc_btn" onclick="recoSave(this)">Kiajánlás rögzítése</button><button class="btn-ghost" onclick="closeModal()">Bezár</button></div>
   <div id="rc_preview"></div>`);
  renderRecoProps();
};
function recoPub(p){return (p.property_photos||[]).filter(ph=>ph.lathatosag==='nyilvanos').sort((a,b)=>(b.borito?1:0)-(a.borito?1:0)||(a.sorrend||0)-(b.sorrend||0));}
function renderRecoProps(){const box=$('#rc_props');if(!box)return;const {ordered,sel}=window._reco;
  box.innerHTML=ordered.map(p=>{const pub=recoPub(p);const chosen=sel[p.id]||[];
    return `<div class="rp-prop"><b>${esc(p.cim||'(cím)')}</b> <span class="muted small">${esc(p.ingatlan_tipus||'')}${p.netto_alap?', '+p.netto_alap+' m²':''} · ${ft((p.mandates||[])[0]?.iranyar)}</span>
      ${pub.length?`<div class="rsel-imgs">${pub.map(ph=>{const i=chosen.indexOf(ph.storage_path);return `<div class="rs-i ${i>=0?'sel':''}" onclick="recoToggle('${p.id}','${esc(ph.storage_path)}')"><img loading="lazy" src="${esc(fotoUrl(ph.storage_path))}">${i>=0?`<span class="rs-c">${i+1}</span>`:''}</div>`;}).join('')}</div>`:'<div class="pill warn">Nincs webre engedélyezett kép</div>'}</div>`;}).join('');
}
window.recoToggle=(pid,key)=>{const sel=window._reco.sel;const arr=sel[pid]||[];const i=arr.indexOf(key);
  if(i>=0)arr.splice(i,1);else{if(arr.length>=4)return toast('Legfeljebb 4 kép ingatlanonként');arr.push(key);}
  sel[pid]=arr;renderRecoProps();};
window.recoPreview=()=>{const {ordered,sel}=window._reco;const intro=$('#rc_intro').value;
  $('#rc_preview').innerHTML=`<div class="section"><h4>Előnézet (amit az érdeklődő lát)</h4><div class="rprev"><div style="white-space:pre-wrap">${esc(intro)}</div>
    ${ordered.map(p=>{const keys=sel[p.id]||[];return `<div class="rp-prop"><div><b>${esc(p.cim||'(cím)')}</b> — ${esc(p.ingatlan_tipus||'')}${p.netto_alap?', '+p.netto_alap+' m²':''} — <b>${ft((p.mandates||[])[0]?.iranyar)}</b></div>
      ${keys.length?`<div class="rp-imgs">${keys.map(k=>`<img src="${esc(fotoUrl(k))}">`).join('')}</div>`:'<div class="muted small">nincs kép kiválasztva</div>'}</div>`;}).join('')}
    <div style="margin-top:.5rem">Üdvözlettel,<br>ÉrtékPont Ingatlan</div></div></div>`;
  $('#rc_preview').scrollIntoView({behavior:'smooth'});};
window.recoMail=()=>{const {ordered}=window._reco;const to=$('#rc_to').value;const subj=encodeURIComponent($('#rc_subj').value);
  const lines=ordered.map(p=>`• ${p.cim||'(cím)'} – ${p.ingatlan_tipus||''}${p.netto_alap?', '+p.netto_alap+' m²':''} – ${ft((p.mandates||[])[0]?.iranyar)}`).join('\n');
  const body=encodeURIComponent($('#rc_intro').value+'\n\n'+lines+'\n\nÜdvözlettel,\nÉrtékPont Ingatlan\n\n(A képes ajánlatot PDF-ben mellékeljük.)');
  window.location.href=`mailto:${to}?subject=${subj}&body=${body}`;};
async function keyToDataUrl(key){try{const r=await sb.storage.from(FOTO_BUCKET).download(key);if(r.error||!r.data)return null;
  return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(r.data);});}catch(e){return null;}}
window.recoPdf=async()=>{if(!(window.jspdf&&window.jspdf.jsPDF)){toast('PDF motor nem töltött be');return;}toast('PDF készítése…');
  const {ordered,sel}=window._reco;const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,M=14;let y=18;
  doc.setFontSize(16);doc.setTextColor(31,59,87);doc.text('ÉrtékPont Ingatlan – Ajánlat',M,y);y+=8;
  doc.setFontSize(10);doc.setTextColor(60,60,60);
  ($('#rc_intro').value||'').split('\n').forEach(ln=>{doc.text(ln||' ',M,y);y+=5;});y+=2;
  for(const p of ordered){if(y>250){doc.addPage();y=18;}
    doc.setFontSize(12);doc.setTextColor(31,59,87);doc.text(String(p.cim||'(cím)'),M,y);y+=5;
    doc.setFontSize(10);doc.setTextColor(60,60,60);doc.text(`${p.ingatlan_tipus||''}${p.netto_alap?', '+p.netto_alap+' m²':''}  –  ${ft((p.mandates||[])[0]?.iranyar)}`,M,y);y+=4;
    const keys=sel[p.id]||[];let x=M;const iw=58,ih=42;
    for(const k of keys){const du=await keyToDataUrl(k);if(!du)continue;if(x+iw>W-M){x=M;y+=ih+3;}if(y+ih>285){doc.addPage();y=18;x=M;}
      const fmt=/^data:image\/png/i.test(du)?'PNG':'JPEG';try{doc.addImage(du,fmt,x,y,iw,ih);}catch(_){}x+=iw+3;}
    y+=ih+8;}

const FOTO_BUCKET='Fotok', DOC_BUCKET='dokumentumok';
let FOTOK_PRIVATE=false; // a Fotok bucket priváttá tétele (utolsó lépés) itt vált true-ra
const _signedCache={};
function fotoUrl(key){if(!key)return '';if(/^https?:/i.test(key))return key;
  return `${SUPABASE_URL}/storage/v1/object/public/${FOTO_BUCKET}/${key.split('/').map(encodeURIComponent).join('/')}`;}
async function fotoUrlAsync(key){if(!key)return '';if(/^https?:/i.test(key))return key;if(!FOTOK_PRIVATE)return fotoUrl(key);
  if(_signedCache[key]&&_signedCache[key].exp>Date.now())return _signedCache[key].url;
  const r=await sb.storage.from(FOTO_BUCKET).createSignedUrl(key,3600);if(r.error)return '';
  _signedCache[key]={url:r.data.signedUrl,exp:Date.now()+3300*1000};return r.data.signedUrl;}
function miniThumb(key){return `<img class="mini" loading="lazy" src="${key?esc(fotoUrl(key)):PH_IMG}" onerror="this.onerror=null;this.src=PH_IMG">`;}
function imgMd(key){return `<img class="thumb-md" loading="lazy" src="${key?esc(fotoUrl(key)):PH_IMG}" onerror="this.onerror=null;this.src=PH_IMG">`;}
function humanSize(b){if(b==null||b==='')return '';b=Number(b);if(b<1024)return b+' B';if(b<1048576)return Math.round(b/1024)+' KB';return (b/1048576).toFixed(1)+' MB';}
function pickCover(pc){if(!pc||!pc.length)return '';const c=pc.find(x=>x.borito)||pc.slice().sort((a,b)=>(a.sorrend||0)-(b.sorrend||0))[0];return (c&&c.storage_path)||'';}
function leadCoverKey(x){const rel=x&&x.lead_photos;const lp=Array.isArray(rel)?rel[0]:rel;if(lp&&lp.storage_path)return lp.storage_path;const pr=Array.isArray(x&&x.properties)?x.properties[0]:(x&&x.properties);return pickCover(pr&&pr.property_photos);}
function taskCover(x,CM){if(x.targy_tabla==='lead')return CM.leadCover[x.targy_id]||'';if(x.targy_tabla==='property'||x.targy_tabla==='ingatlan')return CM.propCover[x.targy_id]||'';return '';}
async function coverMaps(){const [pp,lp,ld]=await Promise.all([
    sb.from('property_photos').select('property_id,storage_path,borito,sorrend'),
    sb.from('lead_photos').select('lead_id,storage_path'),
    sb.from('leads').select('id,property_id')]);
  const best={};(pp.data||[]).forEach(p=>{const c=best[p.property_id];if(!c){best[p.property_id]=p;return;}
    if(p.borito&&!c.borito){best[p.property_id]=p;return;}
    if(!!p.borito===!!c.borito&&(p.sorrend||0)<(c.sorrend||0))best[p.property_id]=p;});
  const propCover={};Object.keys(best).forEach(k=>propCover[k]=best[k].storage_path);
  const leadPhoto={};(lp.data||[]).forEach(p=>{if(!leadPhoto[p.lead_id])leadPhoto[p.lead_id]=p.storage_path;});
  const leadCover={};(ld.data||[]).forEach(l=>{const pc=l.property_id?propCover[l.property_id]:'';leadCover[l.id]=pc||leadPhoto[l.id]||'';});
  Object.keys(leadPhoto).forEach(id=>{if(!leadCover[id])leadCover[id]=leadPhoto[id];});
  return {propCover,leadCover};}
const IMG_RE=/^image\//;
async function uploadFile(bucket,file,prefix){const ext=((file.name.split('.').pop()||'dat').toLowerCase().replace(/[^a-z0-9]/g,''))||'dat';
  const key=`${prefix}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
  const up=await sb.storage.from(bucket).upload(key,file,{cacheControl:'3600',upsert:false});if(up.error)throw up.error;return key;}
async function removeFile(bucket,key){try{const r=await sb.storage.from(bucket).remove([key]);if(r.error){console.warn('Storage törlés sikertelen',bucket,key,r.error.message);return r.error;}return null;}catch(e){console.warn('Storage törlés kivétel',bucket,key,e);return e;}}

    ${p.borito?'':`<button class="btn-ghost btn-sm" onclick="pmCover('${p.id}')">Borító</button>`}

window.pmUpload=async(pid,files)=>{files=[...files];if(!files.length)return;const prog=$('#pmProg');
  const start=(window._pmPhotos||[]).length;const hadCover=(window._pmPhotos||[]).some(p=>p.borito);let ok=0,fail=0;
  for(let i=0;i<files.length;i++){const f=files[i];if(prog)prog.textContent=`Feltöltés ${i+1}/${files.length}…`;
    if(!IMG_RE.test(f.type)){fail++;continue;}
    let key;try{key=await uploadFile(FOTO_BUCKET,f,'properties/'+pid);}catch(e){fail++;continue;}
    const ins=await sb.from('property_photos').insert({property_id:pid,storage_path:key,sorrend:start+i,lathatosag:'belso',borito:false});
    if(ins.error){await removeFile(FOTO_BUCKET,key);fail++;}else ok++;}
  if(ok&&!hadCover){const first=(await sb.from('property_photos').select('id').eq('property_id',pid).order('sorrend').limit(1)).data;if(first&&first[0])await sb.from('property_photos').update({borito:true}).eq('id',first[0].id);}
  if(prog)prog.textContent='';toast(ok?`Feltöltve: ${ok}${fail?', hiba: '+fail:''}`:`Nem sikerült (${fail} hiba)`);await loadPhotoMgr(pid);};
window.pmMove=async(id,dir)=>{const ph=(window._pmPhotos||[]).slice();const idx=ph.findIndex(p=>p.id===id);const j=idx+dir;if(idx<0||j<0||j>=ph.length)return;
  const tmp=ph[idx];ph[idx]=ph[j];ph[j]=tmp;
  for(let k=0;k<ph.length;k++){if(ph[k].sorrend!==k){const r=await sb.from('property_photos').update({sorrend:k}).eq('id',ph[k].id);if(r.error){toast('Sorrend módosítása sikertelen');break;}}}
  await loadPhotoMgr(window._pmPid);};
window.pmCover=async(id)=>{const {error}=await sb.rpc('fn_set_cover',{p_photo:id});if(error){toast('Hiba: '+error.message);return;}toast('Borító beállítva');await loadPhotoMgr(window._pmPid);};
window.pmVis=async(id,to)=>{const r=await sb.from('property_photos').update({lathatosag:to}).eq('id',id);if(r.error){toast('Hiba: '+r.error.message);return;}await loadPhotoMgr(window._pmPid);};
window.pmBulk=async(pid,to)=>{const ids=[...document.querySelectorAll('.pmck:checked')].map(c=>c.value);if(!ids.length)return toast('Előbb jelölj ki képeket');
  const r=await sb.from('property_photos').update({lathatosag:to}).in('id',ids);if(r.error){toast('Hiba: '+r.error.message);return;}toast(ids.length+' kép frissítve');await loadPhotoMgr(pid);};
window.pmDel=async(id)=>{if(!confirm('Biztosan törlöd ezt a fotót?'))return;const ph=(window._pmPhotos||[]).find(p=>p.id===id);
  const r=await sb.from('property_photos').delete().eq('id',id);if(r.error){toast('Törlés sikertelen: '+r.error.message);return;}
  let rmErr=null;if(ph)rmErr=await removeFile(FOTO_BUCKET,ph.storage_path);
  if(ph&&ph.borito){const nx=(await sb.from('property_photos').select('id').eq('property_id',window._pmPid).order('sorrend').limit(1)).data;if(nx&&nx[0])await sb.from('property_photos').update({borito:true}).eq('id',nx[0].id);}
  toast(rmErr?'Rekord törölve, a fájl törlése nem sikerült (naplózva).':'Törölve');await loadPhotoMgr(window._pmPid);};

// ---- Galéria / nagyítás ----
window.galleryOpen=(keys,idx)=>{keys=(keys||[]).filter(Boolean);if(!keys.length)return;let i=idx||0;
  const bg=el('<div class="lightbox"><button class="lb-x">✕</button><button class="lb-nav lb-prev">‹</button><img><button class="lb-nav lb-next">›</button></div>');
  const img=bg.querySelector('img');const show=()=>{img.src=fotoUrl(keys[i]);};show();
  const close=()=>{bg.remove();document.removeEventListener('keydown',kd);};
  bg.querySelector('.lb-prev').onclick=e=>{e.stopPropagation();i=(i-1+keys.length)%keys.length;show();};
  bg.querySelector('.lb-next').onclick=e=>{e.stopPropagation();i=(i+1)%keys.length;show();};
  bg.querySelector('.lb-x').onclick=e=>{e.stopPropagation();close();};
  const kd=e=>{if(e.key==='Escape')close();else if(e.key==='ArrowLeft')bg.querySelector('.lb-prev').click();else if(e.key==='ArrowRight')bg.querySelector('.lb-next').click();};
  bg.onclick=e=>{if(e.target===bg)close();};document.addEventListener('keydown',kd);document.body.appendChild(bg);
  if(keys.length<2){bg.querySelector('.lb-prev').style.display='none';bg.querySelector('.lb-next').style.display='none';}};
window.lightbox=src=>galleryOpen([src],0);

// ---- Lead azonosítókép ----
async function saveLeadPhoto(leadId,file){const old=(await sb.from('lead_photos').select('storage_path').eq('lead_id',leadId).maybeSingle()).data;
  const key=await uploadFile(FOTO_BUCKET,file,'leads/'+leadId);
  const up=await sb.from('lead_photos').upsert({lead_id:leadId,storage_path:key,lathatosag:'belso'},{onConflict:'lead_id'});
  if(up.error){await removeFile(FOTO_BUCKET,key);throw up.error;}
  if(old&&old.storage_path&&old.storage_path!==key)await removeFile(FOTO_BUCKET,old.storage_path);
  return key;}
window.leadPhotoPick=async(leadId,input)=>{const f=input.files[0];if(!f)return;if(!IMG_RE.test(f.type))return toast('Csak képfájl tölthető fel');
  try{await saveLeadPhoto(leadId,f);toast('Azonosítókép mentve');openLead(leadId);}catch(e){toast('Hiba: '+e.message);}};
window.leadPhotoDel=async(leadId)=>{if(!confirm('Azonosítókép törlése?'))return;const old=(await sb.from('lead_photos').select('storage_path').eq('lead_id',leadId).maybeSingle()).data;
  const r=await sb.from('lead_photos').delete().eq('lead_id',leadId);if(r.error){toast('Hiba: '+r.error.message);return;}
  if(old&&old.storage_path)await removeFile(FOTO_BUCKET,old.storage_path);toast('Törölve');openLead(leadId);};
async function transferLeadPhoto(leadId,propId){try{const lp=(await sb.from('lead_photos').select('storage_path,lathatosag').eq('lead_id',leadId).maybeSingle()).data;
  if(!lp||!lp.storage_path)return {ok:true,skipped:true};
  const ex=(await sb.from('property_photos').select('id,borito').eq('property_id',propId)).data||[];
  const hasCover=ex.some(p=>p.borito);const ext=(lp.storage_path.split('.').pop()||'jpg');const newKey='properties/'+propId+'/'+Date.now()+'_lead.'+ext;
  const cp=await sb.storage.from(FOTO_BUCKET).copy(lp.storage_path,newKey);
  if(cp.error){console.warn('lead-foto másolás hiba',cp.error);return {ok:false,error:cp.error.message};}
  const ins=await sb.from('property_photos').insert({property_id:propId,storage_path:newKey,lathatosag:lp.lathatosag||'belso',borito:!hasCover,sorrend:ex.length});
  if(ins.error){await removeFile(FOTO_BUCKET,newKey);return {ok:false,error:ins.error.message};}
  return {ok:true};
 }catch(e){console.warn('lead-foto átvitel',e);return {ok:false,error:e.message};}}

// ---- Dokumentumkezelő ----
const DOC_TYPES=['Tulajdoni lap','Térképmásolat','Megbízási szerződés','Alaprajz','Energetikai tanúsítvány','Villamos biztonsági felülvizsgálat','Hirdetési adatlap / tájékoztató','Építési dokumentum','Egyéb'];
const DOC_PUBLIC_OK=['Alaprajz','Hirdetési adatlap / tájékoztató'];
async function loadDocMgr(pid){const box=$('#docMgr');if(!box)return;
  const q=await sb.from('property_documents').select('*').eq('property_id',pid).order('letrehozva',{ascending:false});
  if(q.error){box.innerHTML='<span class="err small">Dokumentumok betöltése sikertelen: '+esc(q.error.message)+'</span>';return;}
  const d=q.data||[];window._dmPid=pid;
  box.innerHTML=`<div class="up"><select id="dmType" style="max-width:240px;width:auto;margin:0 .3rem 0 0">${DOC_TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
     <label class="btn-gold btn-sm filelbl">+ Dokumentum<input type="file" onchange="dmUpload('${pid}',this.files[0])"></label><span id="dmProg" class="small"></span></div>
   ${d.length?`<div class="tblwrap"><table><tr><th>Típus</th><th>Fájl</th><th>Feltöltve</th><th>Méret</th><th>Láthatóság</th><th></th></tr>
     ${d.map(x=>{const pubOk=DOC_PUBLIC_OK.includes(x.tipus);const web=x.lathatosag==='nyilvanos';return `<tr>
       <td>${esc(x.tipus||'')}</td><td class="small">${esc(x.eredeti_fajlnev||'')}</td><td class="small">${esc((x.letrehozva||'').slice(0,10))}</td><td class="small">${humanSize(x.meret)}</td>
       <td>${pubOk?`<button class="btn-ghost btn-sm" onclick="dmVis('${x.id}','${web?'belso':'nyilvanos'}')">${web?'Nyilvános ✓':'Belső'}</button>`:'<span class="pill" title="Ez a dokumentumtípus védett, nem tehető nyilvánossá">Belső (védett)</span>'}</td>
       <td><button class="btn-ghost btn-sm" onclick="dmOpen('${esc(x.storage_path)}')">Megnyit</button> <button class="btn-ghost btn-sm" onclick="dmDel('${x.id}')">🗑</button></td></tr>`;}).join('')}</table></div>`:'<div class="muted small">Még nincs dokumentum.</div>'}`;}
window.dmUpload=async(pid,file)=>{if(!file)return;const tipus=$('#dmType').value;const prog=$('#dmProg');if(prog)prog.textContent='Feltöltés…';
  let key;try{key=await uploadFile(DOC_BUCKET,file,'properties/'+pid);}catch(e){if(prog)prog.textContent='';return toast('Feltöltés sikertelen: '+e.message);}
  const ins=await sb.from('property_documents').insert({property_id:pid,tipus,storage_path:key,eredeti_fajlnev:file.name,meret:file.size,lathatosag:'belso'});
  if(ins.error){await removeFile(DOC_BUCKET,key);if(prog)prog.textContent='';return toast('Mentés sikertelen: '+ins.error.message);}
  if(prog)prog.textContent='';toast('Dokumentum feltöltve');await loadDocMgr(pid);};
window.dmVis=async(id,to)=>{const r=await sb.from('property_documents').update({lathatosag:to}).eq('id',id);
  if(r.error){toast('Nem engedélyezett: ez a típus nem tehető nyilvánossá.');return;}await loadDocMgr(window._dmPid);};
window.dmOpen=async(key)=>{const r=await sb.storage.from(DOC_BUCKET).createSignedUrl(key,3600);if(r.error){toast('Nem sikerült megnyitni: '+r.error.message);return;}window.open(r.data.signedUrl,'_blank');};
window.dmDel=async(id)=>{if(!confirm('Dokumentum törlése?'))return;const doc=(await sb.from('property_documents').select('storage_path').eq('id',id).single()).data;
  const r=await sb.from('property_documents').delete().eq('id',id);if(r.error){toast('Törlés sikertelen: '+r.error.message);return;}
  let rmErr=null;if(doc&&doc.storage_path)rmErr=await removeFile(DOC_BUCKET,doc.storage_path);toast(rmErr?'Rekord törölve, a fájl törlése nem sikerült (naplózva).':'Törölve');await loadDocMgr(window._dmPid);};

boot();
</script>
